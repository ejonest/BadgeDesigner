<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Custom plaque designer preview</title>
  <desc id="desc">A plaque personalization interface with editing controls and a live award plaque preview.</desc>
  <rect width="1200" height="760" fill="#f5f2eb"/>
